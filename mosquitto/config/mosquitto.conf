# Configuration du broker MQTT du Data-Monstre

listener 1883

# Pas de connexion anonyme : chaque carte et le backend s'authentifient
allow_anonymous false
password_file /mosquitto/config/passwd

# Le fichier passwd n'est pas dans le dépôt, il se génère avec :
# docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd datamonstre <mot_de_passe>
